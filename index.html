<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2a1b5e" />
    <title>Maaf ya, Bil 🐱</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #2a1b5e;
      }
      body {
        font-family: "Baloo 2", ui-rounded, system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }

      /* ---------- Background ---------- */
      #bg {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: linear-gradient(
          180deg,
          #2a1b5e 0%,
          #6b3fa0 48%,
          #ff7eb3 100%
        );
      }
      #tint {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0b2a5e, #3b6fb6);
        opacity: 0;
        transition: opacity 0.6s;
      }
      body.crying #tint {
        opacity: 0.55;
      }
      .star {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        animation: twinkle 3s ease-in-out infinite;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.5);
        }
      }
      .moon {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 28px);
        right: 22px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #fff6d6;
        box-shadow: 0 0 40px 12px rgba(255, 246, 214, 0.45);
      }
      .moon::after {
        content: "";
        position: absolute;
        left: 14px;
        top: 16px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #f3e6b4;
        box-shadow: 22px 20px 0 -2px #f3e6b4;
      }
      .hill {
        position: absolute;
        bottom: -40px;
        border-radius: 50%;
      }
      .float-item {
        position: absolute;
        bottom: -40px;
        animation: rise linear forwards;
        pointer-events: none;
      }
      @keyframes rise {
        from {
          transform: translateY(0) translateX(0) rotate(0);
          opacity: 0;
        }
        10% {
          opacity: 0.9;
        }
        to {
          transform: translateY(-110vh) translateX(var(--dx)) rotate(var(--rot));
          opacity: 0;
        }
      }
      .drop-fall {
        position: absolute;
        top: -30px;
        animation: fallDown linear forwards;
        pointer-events: none;
      }
      @keyframes fallDown {
        from {
          transform: translateY(0);
          opacity: 0.9;
        }
        to {
          transform: translateY(112vh);
          opacity: 0.2;
        }
      }

      /* ---------- Speech bubble ---------- */
      .bubble {
        position: relative;
        animation: bubbleBob 3s ease-in-out infinite;
      }
      .bubble::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -14px;
        margin-left: -14px;
        border: 14px solid transparent;
        border-top-color: rgba(255, 255, 255, 0.96);
        border-bottom: 0;
      }
      @keyframes bubbleBob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      /* ---------- Cat ---------- */
      .catwrap {
        width: min(80vw, 40dvh);
        cursor: pointer;
      }
      .cat *,
      .kit * {
        transform-box: fill-box;
      }
      .breathe {
        transform-origin: 50% 100%;
        animation: breathe 2.6s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1, 1);
        }
        50% {
          transform: scale(1.015, 0.985);
        }
      }
      .tail {
        transform-origin: 0% 100%;
        animation: wag 1.1s ease-in-out infinite;
      }
      @keyframes wag {
        0%,
        100% {
          transform: rotate(-10deg);
        }
        50% {
          transform: rotate(16deg);
        }
      }
      .head {
        transform-origin: 50% 100%;
        animation: tilt 3.4s ease-in-out infinite;
      }
      @keyframes tilt {
        0%,
        100% {
          transform: rotate(-3deg);
        }
        50% {
          transform: rotate(3deg);
        }
      }
      .ear-l {
        transform-origin: 80% 100%;
        animation: twitchL 4s ease-in-out infinite;
      }
      .ear-r {
        transform-origin: 20% 100%;
        animation: twitchR 5s ease-in-out infinite;
      }
      @keyframes twitchL {
        0%,
        88%,
        100% {
          transform: rotate(0);
        }
        92% {
          transform: rotate(-10deg);
        }
        96% {
          transform: rotate(2deg);
        }
      }
      @keyframes twitchR {
        0%,
        80%,
        100% {
          transform: rotate(0);
        }
        85% {
          transform: rotate(10deg);
        }
        90% {
          transform: rotate(-2deg);
        }
      }
      .blink {
        transform-origin: 50% 50%;
        animation: blink 3.6s infinite;
      }
      @keyframes blink {
        0%,
        92%,
        100% {
          transform: scaleY(1);
        }
        95% {
          transform: scaleY(0.08);
        }
      }
      .glint {
        transform-origin: 50% 50%;
        animation: glint 1.6s ease-in-out infinite;
      }
      @keyframes glint {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.25);
        }
      }
      .paws {
        animation: beg 1s ease-in-out infinite;
      }
      @keyframes beg {
        0%,
        100% {
          transform: translateY(0) rotate(0);
        }
        50% {
          transform: translateY(-9px) rotate(-3deg);
        }
      }
      .lip {
        transform-origin: 50% 0%;
        animation: quiver 0.5s ease-in-out infinite;
      }
      @keyframes quiver {
        0%,
        100% {
          transform: scale(1, 1);
        }
        50% {
          transform: scale(1.06, 0.9);
        }
      }

      /* ---------- Anak kucing ---------- */
      .kitten {
        position: absolute;
        cursor: pointer;
        animation: hop 3s ease-in-out infinite;
      }
      @keyframes hop {
        0%,
        55%,
        100% {
          transform: translateY(0);
        }
        62% {
          transform: translateY(-12px);
        }
        70% {
          transform: translateY(0);
        }
        78% {
          transform: translateY(-6px);
        }
        86% {
          transform: translateY(0);
        }
      }
      .k-tail {
        transform-origin: 0% 100%;
        animation: wag 1.3s ease-in-out infinite;
      }
      .k-head {
        transform-origin: 50% 100%;
        animation: tilt 2.8s ease-in-out infinite;
      }
      .k-blink {
        transform-origin: 50% 50%;
        animation: blink 3.2s infinite;
      }
      .k-sad {
        display: none;
      }

      /* ---------- Crying state ---------- */
      .eyes-cry,
      .mouth-cry,
      .tears {
        display: none;
      }
      body.crying .eyes-beg,
      body.crying .mouth-beg,
      body.crying .brows,
      body.crying .k-eyes {
        display: none;
      }
      body.crying .eyes-cry,
      body.crying .mouth-cry,
      body.crying .tears,
      body.crying .k-sad {
        display: inline;
      }
      body.crying .catwrap {
        animation: shake 0.14s linear infinite;
      }
      body.crying .paws {
        animation-duration: 0.35s;
      }
      body.crying .tail {
        animation-duration: 0.5s;
      }
      body.crying .mouth-cry {
        transform-origin: 50% 0%;
        animation: wail 0.3s ease-in-out infinite;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0) rotate(0);
        }
        25% {
          transform: translateX(-3px) rotate(-1deg);
        }
        75% {
          transform: translateX(3px) rotate(1deg);
        }
      }
      @keyframes wail {
        0%,
        100% {
          transform: scaleY(1);
        }
        50% {
          transform: scaleY(1.2);
        }
      }
      .tear {
        transform-origin: 50% 0%;
        animation: stream 0.9s ease-in infinite;
      }
      @keyframes stream {
        0% {
          transform: scaleY(0.1);
          opacity: 0.9;
        }
        70% {
          transform: scaleY(1);
          opacity: 0.9;
        }
        100% {
          transform: scaleY(1);
          opacity: 0.5;
        }
      }
      .drop {
        animation: dropFall 0.9s ease-in infinite;
      }
      @keyframes dropFall {
        0% {
          transform: translateY(0);
          opacity: 1;
        }
        100% {
          transform: translateY(70px);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- Layer 1: background -->

        Jangan ngambek bil maaaaaaapppppppppppppppp beettttttt, itu pingin aku

      <!-- relative + mb-14: wadah untuk anak kucing yang diposisikan di sekeliling kucing besar -->

          <ellipse cx="150" cy="320" rx="95" ry="8" fill="#000" opacity=".25" />

          <g class="breathe">
            <g class="tail">
              <path

              <g class="ear-r">

              </g>
              <ellipse cx="150" cy="152" rx="90" ry="78" fill="url(#fur)" />
              <path
                d="M150 76 L150 96 M131 79 L136 95 M169 79 L164 95"

              />
              <ellipse cx="150" cy="180" rx="32" ry="22" fill="#fff3e0" />
              <ellipse
                cx="90"

              />
              <ellipse
                cx="210"

              <g

                <path d="M96 118 L132 106" />

              </g>

              <g class="eyes-beg">
                <g class="blink">
                  <ellipse cx="118" cy="150" rx="26" ry="30" fill="#2b1a2e" />
                  <ellipse cx="182" cy="150" rx="26" ry="30" fill="#2b1a2e" />
                  <g class="glint">
                    <circle cx="109" cy="138" r="10" fill="#fff" />

                <rect

                />
                <circle class="drop" cx="106" cy="170" r="6" fill="#aee6ff" />

                  class="drop"

                />
                <circle
                  class="drop"

                  cy="170"

            <g class="paws">

              <path
                d="M118 228 L118 236 M127 227 L127 236 M169 227 L169 236 M178 228 L178 236"

        <!-- anak kucing dimasukkan ke sini oleh JavaScript -->

      <p
        id="cap"

      >
        👆 pencet kucingnya, coba deh

    <script>
      const $ = (id) => document.getElementById(id);
      const wrap = $("catwrap"),
        cap = $("cap"),
        floaters = $("floaters"),
        stars = $("stars");
      const idleText = "👆 pencet kucingnya, coba deh";
      const cryLines = [
        "Huhuhu… jangan ngambek dong 🥺",
        "Hiks hiks… maafin aku ya 😭",
        "Kucingnya sedih nih, Bil… 💔",
        "Aku cuma gemes kok, beneran 🥹",
      ];
      const kittenLines = [
        "Mew~ 🐾",
        "Miii! 🥰",
        "Anak kucingnya ikut minta maaf 🥺",
        "Mrrr… 💗",
      ];
      let timer = null,
        capTimer = null,
        taps = 0;

      /* ============ SUARA KUCING LUCU (Web Audio, tanpa file mp3) ============ */
      let ac;
      function audioCtx() {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === "suspended") ac.resume();
        return ac;
      }

      // Satu "nada kucing": nadanya naik dari f0 ke puncak f1, lalu turun ke f2
      function voice({
        f0,
        f1,
        f2,
        len,
        peak = 0.3,
        vib = 6,
        vibDepth = 12,
        trill = 0,
        delay = 0,
      }) {
        try {
          const a = audioCtx();
          const t = a.currentTime + delay;

          // suara utama (lembut) + suara satu oktaf di atasnya (biar berkilau imut)
          const o1 = a.createOscillator();
          o1.type = "triangle";
          const o2 = a.createOscillator();
          o2.type = "sine";
          const g2 = a.createGain();
          g2.gain.value = 0.35;
          [o1, o2].forEach((o, i) => {
            const m = i === 0 ? 1 : 2;
            o.frequency.setValueAtTime(f0 * m, t);
            o.frequency.exponentialRampToValueAtTime(f1 * m, t + len * 0.3);
            o.frequency.exponentialRampToValueAtTime(f2 * m, t + len);
          });

          // getar halus (vibrato) supaya terdengar hidup, bukan seperti bunyi beep
          const lfo = a.createOscillator();
          lfo.frequency.value = vib;
          const lfoGain = a.createGain();
          lfoGain.gain.value = vibDepth * 3; // satuan: cent
          lfo.connect(lfoGain);
          lfoGain.connect(o1.detune);
          lfoGain.connect(o2.detune);

          // filter "vokal": menggeser bunyi dari "mi" ke "aw" seperti mulut membuka
          const vowel = a.createBiquadFilter();
          vowel.type = "peaking";
          vowel.gain.value = 9;
          vowel.Q.value = 2;
          vowel.frequency.setValueAtTime(1100, t);
          vowel.frequency.exponentialRampToValueAtTime(2400, t + len * 0.3);
          vowel.frequency.exponentialRampToValueAtTime(1300, t + len);
          const soft = a.createBiquadFilter();
          soft.type = "lowpass";
          soft.frequency.value = 4500;

          // volume: naik halus, turun pelan (tidak kaget di telinga)
          const env = a.createGain();
          env.gain.setValueAtTime(0.0001, t);
          env.gain.exponentialRampToValueAtTime(peak, t + 0.04);
          env.gain.exponentialRampToValueAtTime(0.0001, t + len);

          // trill: volume dikedip-kedipkan cepat = bunyi "brrp / mrrp"
          const tr = a.createGain();
          tr.gain.value = trill ? 0.55 : 1;
          if (trill) {
            const tl = a.createOscillator();
            tl.frequency.value = trill;
            const td = a.createGain();
            td.gain.value = 0.45;
            tl.connect(td);
            td.connect(tr.gain);
            tl.start(t);
            tl.stop(t + len + 0.05);
          }

          o1.connect(vowel);
          o2.connect(g2);
          g2.connect(vowel);
          vowel.connect(soft);
          soft.connect(env);
          env.connect(tr);
          tr.connect(a.destination);
          [o1, o2, lfo].forEach((o) => {
            o.start(t);
            o.stop(t + len + 0.05);
          });
        } catch (e) {}
      }

      // empat jenis suara siap pakai (p = tinggi nada, d = jeda mulai dalam detik)
      const mew = (p = 1, d = 0) =>
        voice({
          f0: 620 * p,
          f1: 1150 * p,
          f2: 760 * p,
          len: 0.42,
          peak: 0.32,
          delay: d,
        });
      const mrrp = (p = 1, d = 0) =>
        voice({
          f0: 420 * p,
          f1: 640 * p,
          f2: 560 * p,
          len: 0.26,
          peak: 0.3,
          trill: 26,
          delay: d,
        });
      const miaaw = (p = 1, d = 0) =>
        voice({
          f0: 520 * p,
          f1: 980 * p,
          f2: 540 * p,
          len: 1.0,
          peak: 0.3,
          vib: 7,
          vibDepth: 40,
          delay: d,
        });
      const squeak = (p = 1, d = 0) =>
        voice({
          f0: 1000 * p,
          f1: 1700 * p,
          f2: 1200 * p,
          len: 0.2,
          peak: 0.22,
          delay: d,
        });

      /* ============ BACKGROUND ============ */
      for (let i = 0; i < 45; i++) {
        const s = document.createElement("div");
        s.className = "star";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 55 + "%";
        s.style.animationDelay = Math.random() * 3 + "s";
        s.style.animationDuration = 2 + Math.random() * 3 + "s";
        stars.appendChild(s);
      }

      const happy = ["💗", "💖", "🐾", "🥺", "✨", "🌸", "🐱"];
      function spawn() {
        const crying = document.body.classList.contains("crying");
        const el = document.createElement("span");
        el.textContent = crying
          ? "💧"
          : happy[Math.floor(Math.random() * happy.length)];
        el.style.left = Math.random() * 100 + "%";
        el.style.fontSize = 16 + Math.random() * 20 + "px";
        const dur = crying ? 2.2 + Math.random() * 1.6 : 6 + Math.random() * 5;
        el.style.animationDuration = dur + "s";
        if (crying) {
          el.className = "drop-fall";
        } else {
          el.className = "float-item";
          el.style.setProperty("--dx", Math.random() * 80 - 40 + "px");
          el.style.setProperty("--rot", Math.random() * 60 - 30 + "deg");
        }
        floaters.appendChild(el);
        el.addEventListener("animationend", () => el.remove());
      }
      setInterval(spawn, 650);

      /* ============ ANAK KUCING ============ */
      // Satu template SVG dipakai 3x. Warnanya diatur lewat CSS variable (--fur, --belly, --stripe)
      const kittenSVG = () => `
  <svg viewBox="0 0 120 120" class="kit block w-full" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="60" cy="115" rx="34" ry="5" fill="#000" opacity=".22"/>
    <path class="k-tail" d="M88 100 C112 100 112 78 100 70" stroke="var(--fur)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="60" cy="96" rx="29" ry="21" fill="var(--fur)"/>
    <ellipse cx="60" cy="102" rx="16" ry="14" fill="var(--belly)"/>
    <ellipse cx="44" cy="113" rx="11" ry="6" fill="var(--fur)"/>
    <ellipse cx="76" cy="113" rx="11" ry="6" fill="var(--fur)"/>
    <g class="k-head">
      <path d="M27 48 L24 14 L50 32 Z" fill="var(--fur)"/>
      <path d="M31 42 L30 24 L44 33 Z" fill="#ffb6c8"/>
      <path d="M93 48 L96 14 L70 32 Z" fill="var(--fur)"/>
      <path d="M89 42 L90 24 L76 33 Z" fill="#ffb6c8"/>
      <ellipse cx="60" cy="56" rx="38" ry="32" fill="var(--fur)"/>
      <path d="M60 26 L60 36 M51 28 L53 36 M69 28 L67 36" stroke="var(--stripe)" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="60" cy="66" rx="16" ry="11" fill="var(--belly)"/>
      <ellipse cx="33" cy="66" rx="7" ry="4.5" fill="#ff8fa8" opacity=".6"/>
      <ellipse cx="87" cy="66" rx="7" ry="4.5" fill="#ff8fa8" opacity=".6"/>
      <g class="k-eyes k-blink">
        <ellipse cx="44" cy="55" rx="10" ry="12" fill="#2b1a2e"/>
        <ellipse cx="76" cy="55" rx="10" ry="12" fill="#2b1a2e"/>
        <circle cx="41" cy="50" r="4.5" fill="#fff"/>
        <circle cx="73" cy="50" r="4.5" fill="#fff"/>
        <circle cx="47" cy="60" r="2" fill="#fff"/>
        <circle cx="79" cy="60" r="2" fill="#fff"/>
      </g>
      <g class="k-sad" stroke="#2b1a2e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M36 49 L50 56 L36 63"/>
        <path d="M84 49 L70 56 L84 63"/>
      </g>
      <path d="M56 65 Q60 62 64 65 Q60 70 56 65 Z" fill="#ff7a9c"/>
      <path d="M60 69 Q60 74 55 75 M60 69 Q60 74 65 75" stroke="#7a3b12" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </svg>`;

      // css = posisi di sekitar kucing besar (left/right/bottom/width dalam % dari lebar kucing)
      const kittens = [
        {
          fur: "#fff0d9",
          belly: "#ffffff",
          stripe: "#f2c48a",
          css: "left:-12%;bottom:-3%;width:27%",
          pitch: 1.9,
          delay: "0s",
        },
        {
          fur: "#aab3c6",
          belly: "#e9edf5",
          stripe: "#7d879c",
          css: "right:-12%;bottom:-3%;width:27%",
          pitch: 1.7,
          delay: ".9s",
        },
        {
          fur: "#b98458",
          belly: "#f3dcc2",
          stripe: "#8a5a34",
          css: "left:24%;bottom:-17%;width:21%",
          pitch: 2.1,
          delay: "1.7s",
        },
      ];

      function poke(el, k) {
        // suara anak kucing: "mip!" kecil, kadang ditambah "mrrp"
        const p = k.pitch / 1.9 + Math.random() * 0.15;
        squeak(p);
        if (Math.random() < 0.5) mrrp(p * 1.6, 0.16);

        try {
          navigator.vibrate && navigator.vibrate(20);
        } catch (e) {}
        // loncat kecil (dipasang di <svg>-nya supaya tidak bentrok dengan animasi hop)
        el.firstElementChild.animate(
          [
            { transform: "translateY(0) scale(1,1)" },
            { transform: "translateY(-26px) scale(.92,1.1)" },
            { transform: "translateY(0) scale(1.1,.9)" },
            { transform: "translateY(0) scale(1,1)" },
          ],
          { duration: 450, easing: "ease-out" },
        );
        for (let i = 0; i < 4; i++) setTimeout(spawn, i * 80);
        if (!document.body.classList.contains("crying")) {
          cap.textContent =
            kittenLines[Math.floor(Math.random() * kittenLines.length)];
          clearTimeout(capTimer);
          capTimer = setTimeout(() => {
            if (!document.body.classList.contains("crying"))
              cap.textContent = idleText;
          }, 1800);
        }
      }

      kittens.forEach((k) => {
        const el = document.createElement("div");
        el.className = "kitten";
        el.style.cssText = `${k.css};--fur:${k.fur};--belly:${k.belly};--stripe:${k.stripe};animation-delay:${k.delay}`;
        el.innerHTML = kittenSVG();
        el.addEventListener("pointerdown", (e) => {
          e.stopPropagation(); // supaya kucing besar tidak ikut nangis
          poke(el, k);
        });
        wrap.appendChild(el);
      });

      /* ============ KUCING BESAR NANGIS ============ */
      function stopCry() {
        document.body.classList.remove("crying");
        cap.textContent = idleText;
      }

      function cry() {
        clearTimeout(timer);
        taps++;
        document.body.classList.add("crying");
        cap.textContent = cryLines[taps % cryLines.length];
        mew(1); // "mew!"
        mew(0.92, 0.32); // "mew~" kedua
        miaaw(0.85, 1); // "miaaaw~" panjang yang sedih dan bergetar
        try {
          navigator.vibrate && navigator.vibrate([40, 30, 40]);
        } catch (e) {}
        for (let i = 0; i < 6; i++) setTimeout(spawn, i * 90);
        timer = setTimeout(stopCry, 3800);
      }

      wrap.addEventListener("pointerdown", cry);
    </script>
  </body>
</html>
